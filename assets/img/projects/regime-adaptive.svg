      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="100%" stop-color="#111113"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#8b7444"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#222226" stroke-width="1"/>
  <!-- Geometric motif -->
  <g opacity="0.18" stroke="#8b7444" stroke-width="0.8" fill="none"><rect x="1040" y="50" width="80" height="60" rx="2"/><line x1="1067" y1="50" x2="1067" y2="110"/><line x1="1093" y1="50" x2="1093" y2="110"/><line x1="1040" y1="70" x2="1120" y2="70"/><line x1="1040" y1="90" x2="1120" y2="90"/></g>
