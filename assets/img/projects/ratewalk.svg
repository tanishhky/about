<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="100%" stop-color="#111113"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#8b7444"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#222226" stroke-width="1"/>
  <!-- Geometric motif: a rate-path staircase (Markov moves) -->
  <g opacity="0.2" stroke="#8b7444" stroke-width="1" fill="none">
    <polyline points="980,140 1020,140 1020,110 1060,110 1060,125 1100,125 1100,90 1140,90"/>
    <circle cx="1020" cy="140" r="3" fill="#8b7444" stroke="none"/>
    <circle cx="1060" cy="110" r="3" fill="#8b7444" stroke="none"/>
    <circle cx="1100" cy="125" r="3" fill="#8b7444" stroke="none"/>
  </g>
  <!-- Accent line -->
  <rect x="60" y="280" width="120" height="3" rx="1.5" fill="url(#accent)"/>
  <!-- Title -->
  <text x="60" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="400" fill="#e8e6e3" letter-spacing="-1">RateWalk</text>
  <!-- Subtitle -->
  <text x="60" y="385" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" font-style="italic" fill="#8a8a8e">Markov Rate Forecasting &amp; Fixed-Income Monte Carlo</text>
  <!-- Tech stack -->
  <text x="60" y="440" font-family="monospace" font-size="14" fill="#55555a" letter-spacing="1">Markov Chains &#183; FRED/ALFRED &#183; Walk-Forward &#183; Monte Carlo</text>
  <!-- Bottom border -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accent)" opacity="0.5"/>
</svg>
